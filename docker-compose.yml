version: "3.9"

services:
  twitch_db:
    image: mongo:latest
    ports:
      - "27019:27017"
    volumes:
      - mongo-data:/data/db

  init_twitch_db:
    build:
      context: ./Init_DB
      dockerfile: Dockerfile
    container_name: init_twitch_db
    image: cesagram/m4d/init:1.1
    depends_on:
      - twitch_db
    environment:
      - MONGO_DB=mongodb://twitch_db:27017


  twitch_api:
    build:
      context: ./Twitch_API
      dockerfile: Dockerfile
    image: cesagram/m4d/api:1.1
    ports:
      - 3000:3000
    container_name: twitch_api
    depends_on:
      init_twitch_db:
        condition: service_completed_successfully
    environment:
      - MONGO_DB=mongodb://twitch_db:27017/
    #restart: unless-stopped

  twitch_ctrl:
    build:
      context: ./Twitch_Ctrl
      dockerfile: Dockerfile
    image: cesagram/m4d/ctrl:1.0
    container_name: twitch_ctrl
    depends_on:
      - twitch_api
    environment:
      - SOCKET_URL=http://twitch_api:3000
      - BOOTSTRAP_SERVERS=160.40.53.99:9092
      - NEO4J_URL=http://160.40.53.99:4567

volumes:
  mongo-data:    

networks:
  default:
    name: cesagram_network
    # extrenal: true