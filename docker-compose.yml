version: "3.9"

services:
  twitch_db:
    container_name: twitch_db
    image: mongo:latest
    ports:
      - "27019:27017"
    volumes:
      - mongo-data:/data/db

  init_twitch_db:
    build:
      context: ./Init_DB
      dockerfile: Dockerfile
    container_name: init_twitch_db
    image: cesagram/m4d/init:1.1
    depends_on:
      - twitch_db
    environment:
      - MONGO_DB=mongodb://twitch_db:27017
      - MONGO_DB_NAME=games
      - MONGO_COLLECTION_NAME=games_collection

  twitch_api:
    build:
      context: ./Twitch_API
      dockerfile: Dockerfile
    image: cesagram/m4d/twitch_api:4.0
    ports:
      - 3000:3000
    container_name: twitch_api
    depends_on:
      init_twitch_db:
        condition: service_completed_successfully
    environment:
      - MONGO_DB=mongodb://twitch_db:27017/
      - MONGO_DB_NAME=games
      - MONGO_COLLECTION_NAME=games_collection
